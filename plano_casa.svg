<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Planta Baja -->
  <rect x="50" y="50" width="700" height="220" fill="#f5f5dc" stroke="#333" stroke-width="2"/>
  <text x="400" y="40" font-size="20" text-anchor="middle" fill="#333">Planta Baja</text>

  <!-- Habitaciones abajo -->
  <rect x="60" y="60" width="180" height="80" fill="#e6e6fa" stroke="#333"/>
  <text x="150" y="100" font-size="14" text-anchor="middle">Habitación 1</text>

  <rect x="250" y="60" width="180" height="80" fill="#e6e6fa" stroke="#333"/>
  <text x="340" y="100" font-size="14" text-anchor="middle">Habitación 2</text>

  <rect x="440" y="60" width="180" height="80" fill="#e6e6fa" stroke="#333"/>
  <text x="530" y="100" font-size="14" text-anchor="middle">Habitación Principal</text>
  <text x="530" y="120" font-size="12" text-anchor="middle">(Tina y baño)</text>

  <rect x="630" y="60" width="110" height="80" fill="#ffe4e1" stroke="#333"/>
  <text x="685" y="100" font-size="12" text-anchor="middle">Baño Social</text>

  <!-- Cocina y Bar -->
  <rect x="60" y="150" width="250" height="110" fill="#fafad2" stroke="#333"/>
  <text x="185" y="200" font-size="14" text-anchor="middle">Cocina Americana</text>

  <rect x="320" y="150" width="420" height="110" fill="#ffe4b5" stroke="#333"/>
  <text x="530" y="200" font-size="14" text-anchor="middle">Bar Campestre (ladrillo limpio)</text>

  <!-- Planta Alta -->
  <rect x="50" y="300" width="700" height="220" fill="#e0ffff" stroke="#333" stroke-width="2"/>
  <text x="400" y="290" font-size="20" text-anchor="middle" fill="#333">Segundo Piso</text>

  <rect x="60" y="310" width="180" height="80" fill="#e6e6fa" stroke="#333"/>
  <text x="150" y="350" font-size="14" text-anchor="middle">Habitación 3</text>

  <rect x="250" y="310" width="180" height="80" fill="#e6e6fa" stroke="#333"/>
  <text x="340" y="350" font-size="14" text-anchor="middle">Habitación 4</text>

  <rect x="440" y="310" width="180" height="80" fill="#ffb6c1" stroke="#333"/>
  <text x="530" y="350" font-size="14" text-anchor="middle">Barbie Cui</text>

  <rect x="630" y="310" width="110" height="80" fill="#b0e0e6" stroke="#333"/>
  <text x="685" y="350" font-size="12" text-anchor="middle">Lavaplatos</text>

</svg>